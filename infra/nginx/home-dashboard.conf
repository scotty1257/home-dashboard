# Home Dashboard reverse proxy
# Serves the built web app, proxies /api (Fastify) and /voice (FastAPI).

server {
    listen 8080;
    server_name _;

    root /opt/home-dashboard/apps/dashboard-web/dist;
    index index.html;

    # Voice-note uploads: allow a full 8 MiB recording plus multipart overhead.
    client_max_body_size 12m;

    # Single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API (REST + SSE)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: disable buffering for live updates
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Voice assistant service
    # Trailing slash strips the /voice/ prefix: the client calls
    # /voice/api/voice/session, the service exposes /api/voice/session.
    location /voice/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
