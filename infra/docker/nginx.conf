# Docker-network nginx config: proxies to the api/voice compose services.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /voice/ {
        proxy_pass http://voice:8788;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
